[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-log-monitoring-alerting-system"
version = "0.1.0"
description = "Distributed log monitoring and alerting lab with anomaly detection and failure simulation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Amandeep Singh" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
log-monitoring = "log_monitoring.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
